receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # A debug exporter prints telemetry out directly to the collector's terminal logs
  debug:
    verbosity: basic

  # Scraped by Prometheus (see prometheus.yml)
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Loki accepts OTLP logs natively on /otlp
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

  # Tempo accepts OTLP traces natively on gRPC 4317
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
