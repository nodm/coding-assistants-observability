apiVersion: 1

datasources:
  - name: Prometheus
    uid: claude-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: claude-loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Tempo
    uid: claude-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      streamingEnabled:
        search: false
        metrics: false
